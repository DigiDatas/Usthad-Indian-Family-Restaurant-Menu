<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-gray-800">

    <!-- Login Protection Overlay -->
    <div id="admin-login-overlay" class="fixed inset-0 z-50 bg-gray-900 flex flex-col items-center justify-center text-white px-4">
        <i class="fas fa-lock text-6xl text-red-500 mb-6"></i>
        <h1 class="text-3xl font-black mb-2">Admin Access Only</h1>
        <p class="text-gray-400 mb-6 text-center">Checking your security credentials...</p>
        <button onclick="window.location.href='index.html'" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-bold transition">Return to Main Menu</button>
    </div>

    <!-- Top Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-40 border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-red-100 text-red-600 rounded-lg flex items-center justify-center text-xl shadow-sm">
                    <i class="fas fa-chart-line"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-900 tracking-tight">Order Dashboard</h1>
            </div>
            <button onclick="logoutAdmin()" class="flex items-center gap-2 text-gray-500 hover:text-red-600 font-bold transition">
                <i class="fas fa-sign-out-alt"></i> Sign Out
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-end mb-6">
            <div>
                <h2 class="text-2xl font-black text-gray-800">Live Orders</h2>
                <p class="text-sm text-gray-500">Manage your incoming restaurant orders.</p>
            </div>
            <button onclick="fetchOrders()" class="bg-white border border-gray-200 text-gray-700 px-4 py-2 rounded-lg shadow-sm hover:bg-gray-50 transition flex items-center gap-2 font-bold text-sm">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>

        <!-- Orders Grid -->
        <div id="orders-container" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Loading State -->
            <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-400">
                <i class="fas fa-circle-notch fa-spin text-4xl mb-4 text-red-500"></i>
                <p class="font-medium animate-pulse">Loading Live Orders...</p>
            </div>
        </div>
    </main>

    <script>
        // --- Supabase Connection ---
        const SUPABASE_URL = "https://vhrxsjfblldksnalpyio.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_we3X4oxc_1R2mQVtlSuJVA_gGcQoQ-k"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- Secure Supabase Auth Check ---
        async function verifyAdmin() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            const overlay = document.getElementById('admin-login-overlay');
            
            // Check if user is logged in AND has the admin app metadata flag
            const userMeta = session?.user?.app_metadata;
            const isAdmin = userMeta && userMeta.is_admin === true;
            
            if (!session || !isAdmin) {
                overlay.innerHTML = `
                    <i class="fas fa-shield-alt text-6xl text-red-500 mb-6"></i>
                    <h1 class="text-3xl font-black mb-2">Access Denied</h1>
                    <p class="text-gray-400 mb-6 text-center">This area is restricted to verified administrators.</p>
                    <button onclick="window.location.href='index.html'" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-bold transition">Return to Main Menu</button>
                `;
            } else {
                overlay.classList.add('hidden');
                fetchOrders();
            }
        }

        // --- Fetch Orders ---
        async function fetchOrders() {
            const container = document.getElementById('orders-container');
            
            // Supabase RLS will automatically block this query if not logged in as admin
            const { data: orders, error } = await supabaseClient
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Error fetching orders:", error);
                container.innerHTML = `<div class="col-span-full text-center text-red-500 font-bold py-10">Access Denied or Database Error.</div>`;
                return;
            }

            container.innerHTML = '';

            if (!orders || orders.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-400 bg-white rounded-2xl border border-gray-200 border-dashed">
                        <i class="fas fa-inbox text-5xl mb-4 text-gray-300"></i>
                        <h3 class="text-xl font-bold text-gray-500">No Orders Yet</h3>
                        <p class="text-sm">When customers place orders, they will appear here.</p>
                    </div>`;
                return;
            }

            orders.forEach(order => {
                const date = new Date(order.created_at).toLocaleString();
                
                let statusColor = "bg-gray-100 text-gray-600";
                if(order.status === 'Pending') statusColor = "bg-yellow-100 text-yellow-700";
                if(order.status === 'Cooking') statusColor = "bg-blue-100 text-blue-700";
                if(order.status === 'Completed') statusColor = "bg-green-100 text-green-700";
                if(order.status === 'Cancelled') statusColor = "bg-red-100 text-red-700";

                let itemsHtml = '';
                if (order.items && Array.isArray(order.items)) {
                    order.items.forEach(item => {
                        itemsHtml += `<div class="flex justify-between text-sm py-1 border-b border-gray-50 last:border-0">
                            <span class="font-medium text-gray-700">${item.qty}x ${item.name}</span>
                            <span class="text-gray-500">${(item.price * item.qty).toFixed(2)}</span>
                        </div>`;
                    });
                }

                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex flex-col";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-wider ${statusColor}">${order.status}</span>
                            <h3 class="font-bold text-gray-900 mt-2 text-lg">${order.order_type}</h3>
                            <p class="text-xs text-gray-400 font-medium">${date}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-bold text-gray-400 uppercase tracking-wider">Total</p>
                            <p class="text-2xl font-black text-green-600">${order.total_amount}</p>
                        </div>
                    </div>
                    
                    ${order.table_number ? `<div class="bg-gray-50 p-2 rounded-lg text-sm font-bold text-gray-700 mb-3"><i class="fas fa-chair text-gray-400 w-5"></i> Table: <span class="text-red-500">${order.table_number}</span></div>` : ''}
                    ${order.delivery_address ? `<div class="bg-gray-50 p-2 rounded-lg text-xs font-medium text-gray-600 mb-3"><i class="fas fa-map-marker-alt text-gray-400 w-4"></i> ${order.delivery_address}</div>` : ''}

                    <div class="bg-gray-50 rounded-xl p-3 mb-4 flex-grow">
                        ${itemsHtml}
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-auto pt-4 border-t border-gray-100">
                        <button onclick="updateStatus('${order.id}', 'Pending')" class="py-2 text-xs font-bold rounded-lg bg-yellow-50 text-yellow-700 hover:bg-yellow-100 transition">Pending</button>
                        <button onclick="updateStatus('${order.id}', 'Cooking')" class="py-2 text-xs font-bold rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100 transition">Cooking</button>
                        <button onclick="updateStatus('${order.id}', 'Completed')" class="py-2 text-xs font-bold rounded-lg bg-green-50 text-green-700 hover:bg-green-100 transition">Completed</button>
                        <button onclick="updateStatus('${order.id}', 'Cancelled')" class="py-2 text-xs font-bold rounded-lg bg-red-50 text-red-700 hover:bg-red-100 transition">Cancel</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function updateStatus(orderId, newStatus) {
            const { error } = await supabaseClient
                .from('orders')
                .update({ status: newStatus })
                .eq('id', orderId);

            if (error) alert("Could not update status: " + error.message);
            else fetchOrders();
        }

        async function logoutAdmin() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        window.onload = verifyAdmin;
    </script>
</body>
</html>
