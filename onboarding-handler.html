<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating | QRGate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-200 text-center space-y-4 max-w-sm w-full">
        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-xl animate-spin">
            <i class="fas fa-spinner"></i>
        </div>
        <h2 class="font-bold text-gray-900 text-sm">Setting up your workspace...</h2>
        <p class="text-xs text-gray-400">Verifying your account credentials and preparing your restaurant dashboard.</p>
    </div>

    <script>
        const SUPABASE_URL = "https://vhrxsjfblldksnalpyio.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_we3X4oxc_1R2mQVtlSuJVA_gGcQoQ-k";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.onload = async function() {
            // 1. Fetch active session from Supabase after Google redirect
            const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
            
            if (sessionError || !session) {
                console.error("No active session found:", sessionError);
                window.location.href = 'index.html';
                return;
            }

            const user = session.user;

            // 2. Check if a profile already exists for this user
            let { data: profile, error: profileError } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            // 3. If no profile exists, this is a brand new merchant registering via Google!
            if (!profile) {
                // A. Create a pending tenant record for their business
                const defaultBusinessName = user.user_metadata && user.user_metadata.full_name 
                    ? `${user.user_metadata.full_name}'s Restaurant` 
                    : 'New Restaurant';

                const { data: newTenant, error: tenantError } = await supabaseClient
                    .from('tenants')
                    .insert([{ 
                        business_name: defaultBusinessName,
                        plan_tier: 'basic',
                        status: 'pending' // 🛑 Placed in pending approval mode for Super Admin review!
                    }])
                    .select()
                    .single();

                if (tenantError) {
                    alert("Error provisioning business container: " + tenantError.message);
                    window.location.href = 'index.html';
                    return;
                }

                // B. Create their admin profile linked to the new tenant ID
                const { error: newProfileError } = await supabaseClient
                    .from('profiles')
                    .insert([{
                        id: user.id,
                        email: user.email,
                        full_name: user.user_metadata ? user.user_metadata.full_name : 'Restaurant Admin',
                        role: 'tenant_admin',
                        restaurant_id: newTenant.id
                    }]);

                if (newProfileError) {
                    alert("Error setting up user profile: " + newProfileError.message);
                    window.location.href = 'index.html';
                    return;
                }

                // Redirect fresh merchant to their admin panel (which will show the pending screen)
                window.location.href = 'admin.html';
                return;
            }

            // 4. Returning User Router (Check Role)
            if (profile.role === 'super_admin') {
                window.location.href = 'super-admin.html';
            } else {
                window.location.href = 'admin.html';
            }
        };
    </script>
</body>
</html>
